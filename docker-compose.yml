version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: scsms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: reportissuedb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scsms-net

  backend:
    image: eclipse-temurin:21-jre
    container_name: scsms-backend
    volumes:
      - ./target/ROOT.jar:/app/ROOT.jar
      - uploads:/app/uploads
    working_dir: /app
    command: ["java", "-jar", "ROOT.jar"]
    depends_on:
      - mysql
    ports:
      - "8081:8081"
    networks:
      - scsms-net
    environment:
      PORT: 8081
      MYSQL_HOSTNAME: scsms-mysql
      MYSQL_PORT: 3306
      MYSQL_DB_NAME: reportissuedb
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: password

volumes:
  mysql_data:
  uploads:

networks:
  scsms-net:
